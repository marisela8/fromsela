.moon{

    background:#fff7e8;
    top:9%;
    right:13%;

    box-shadow:
        0 0 25px #fff,

        0 0 130px rgba(255,180,190,.25);

    animation:moonGlow 5s ease-in-out infinite;
}

@keyframes moonGlow{
    0%,100%{
        box-shadow:
        0 0 25px #fff,
        0 0 60px rgba(255,230,210,.6);
    }

    50%{
        box-shadow:
        0 0 35px #fff,
        0 0 100px rgba(255,220,220,.9);
    }
}

/* =========================
   STARS
========================= */

.star{
    position:absolute;
    color:white;
    animation:twinkle 2s ease-in-out infinite alternate;
    opacity:.7;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}

.glow{

    transform:translate(-50%,-50%);
    border-radius:50%;

    filter:blur(100px);

    animation:breathingGlow 5s infinite ease-in-out;
}

@keyframes breathingGlow{
    0%,100%{

        transform:translate(-50%,-50%) scale(1.2);
    }
}
