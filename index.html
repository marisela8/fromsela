<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For My Amazing Naba 1 Mom ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
            text-align: center;
            color: #6b2145;
        }

        .card {
            background: purple;
            padding: 40px;
            border-radius: 25px;
            width: 85%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 28px;
        }

        button {
            background: #d63384;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ad2165;
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            line-height: 1.7;
        }

        .heart {
            font-size: 45px;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="heart">💌</div>

    <h1>Hi Na...</h1>

    <p>There is something I want you to open.</p>

    <button onclick="revealMessage()">Tap to reveal ❤️</button>

    <div id="message">
        <strong>I LOVE YOU, Na ❤️</strong>
        <br><br>
        You are my world and im grateful for your life,
        You are my favourite person in this whole world.
        <br><br>
        No matter how simple this little page is,
        I just wanted you to know that I LOVE YOU and I made it just for you🥹❤️.
        <br><br>
        ❤️
    </div>
</div>

<script>
function revealMessage() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
