<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #02030b;
    font-family: Georgia, serif;
}

/* NIGHT SKY */

.sky {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at 50% 65%,
            #35122e 0%,
            #120c25 35%,
            #050718 70%,
            #010107 100%);

    animation: skyPulse 8s ease-in-out infinite;
}

@keyframes skyPulse {
    0%,100% {
        filter: brightness(.8);
    }

    50% {
        filter: brightness(1.15);
    }
}

/* MOON */

.moon {
    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background: #fff5d6;

    top: 12%;
    left: 50%;

    transform: translateX(-50%);

    box-shadow:
        0 0 25px #fff,
        0 0 70px rgba(255,240,190,.7),
        0 0 140px rgba(255,210,180,.25);

    animation:
        moonAppear 3s ease forwards,
        moonFloat 6s ease-in-out infinite 3s;
}

@keyframes moonAppear {
    from {
        opacity: 0;
        transform: translateX(-50%) scale(.1);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }
}

@keyframes moonFloat {
    0%,100% {
        transform: translateX(-50%) translateY(0);
    }

    50% {
        transform: translateX(-50%) translateY(-12px);
    }
}

/* STARS */

.star {
    position: absolute;
    color: white;

    animation:
        starTwinkle 2s infinite alternate,
        starDrift 10s linear infinite;
}

@keyframes starTwinkle {
    from {
        opacity: .1;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

@keyframes starDrift {
    from {
        margin-left: 0;
    }

    to {
        margin-left: 25px;
    }
}

/* SHOOTING STAR */

.shooting-star {
    position: absolute;

    width: 180px;
    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        white,
        #ffb6d1
    );

    transform: rotate(-25deg);

    top: 22%;
    left: -250px;

    box-shadow: 0 0 12px white;

    animation: shooting 4s ease-in-out 2s forwards;
}

@keyframes shooting {

    0% {
        left: -250px;
        top: 20%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    80% {
        left: 120%;
        top: 55%;
        opacity: 1;
    }

    100% {
        left: 130%;
        opacity: 0;
    }
}

/* DISTANT MOUNTAINS */

.mountains {
    position: absolute;

    bottom: 0;

    width: 100%;
    height: 40%;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            #090b17 45%,
            #090b17 60%,
            transparent 60%
        );

    opacity: .9;
}

/* FOREST */

.forest {
    position: absolute;

    bottom: 0;

    width: 100%;
    height: 32%;

    display: flex;
    justify-content: space-around;
    align-items: flex-end;
}

.tree {
    position: relative;

    width: 70px;
    height: 190px;

    background:
        linear-gradient(
            90deg,
            #050604,
            #121a0c,
            #050604
        );

    border-radius: 50% 50% 5% 5%;
}

.tree:before,
.tree:after {
    content: "";

    position: absolute;

    background: #101b0d;

    border-radius: 50%;
}

.tree:before {
    width: 150px;
    height: 150px;

    top: -90px;
    left: -40px;
}

.tree:after {
    width: 130px;
    height: 130px;

    top: -50px;
    left: 25px;
}

/* TIGERS */

.tiger {
    position: absolute;

    bottom: 17%;

    font-size: 70px;

    z-index: 10;

    filter:
        drop-shadow(0 0 10px rgba(255,180,120,.3));

    animation: tigerWalk 12s linear infinite;
}

.tiger.one {
    left: -120px;
}

.tiger.two {
    left: -300px;

    font-size: 55px;

    animation-delay: 5s;
}

@keyframes tigerWalk {

    0% {
        transform: translateX(0);
    }

    45% {
        transform: translateX(70vw);
    }

    50% {
        transform: translateX(75vw) scaleX(-1);
    }

    95% {
        transform: translateX(-20vw) scaleX(-1);
    }

    100% {
        transform: translateX(-20vw);
    }
}

/* FIREFLIES */

.firefly {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff4a8;

    box-shadow:
        0 0 8px #fff4a8,
        0 0 20px #ffe66d;

    animation: fireflyMove 7s ease-in-out infinite alternate;
}

@keyframes fireflyMove {

    0% {
        transform: translate(0,0);
        opacity: .1;
    }

    50% {
        opacity: 1;
    }
